name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dashboard,dev]"
      - run: pytest -q
      - name: Dashboard compiles
        run: python -m compileall -q dashboard
      - name: End-to-end run on the sample data
        run: |
          windmaint validate
          windmaint run --scheduler milp --out outputs
